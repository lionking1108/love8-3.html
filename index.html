<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Happy Women'sDay 8-3💖</title>

    <style>
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #ff9a9e, #fad0c4);
        font-family: Arial;
        overflow: hidden;
        color: white;
        text-align: center;
      }

      /* trang */
      .page {
        display: none;
        position: relative;
        z-index: 2;
      }
      #page5 {
        position: relative;
        height: 300px;
      }
      .active {
        display: block;
      }

      /* hoa ly */
      .lily {
        width: 120px;
        animation: bloom 2s ease forwards;
      }

      @keyframes bloom {
        0% {
          transform: scale(0);
        }
        100% {
          transform: scale(1);
        }
      }

      .flower-field {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 0;
      }

      /* hoa */
      .flower {
        position: absolute;
        font-size: 28px;
        animation: bloomFloat 6s ease-in-out infinite;
      }

      @keyframes bloomFloat {
        0% {
          transform: scale(0) translateY(0);
          opacity: 0;
        }
        20% {
          transform: scale(1) translateY(0);
          opacity: 1;
        }
        100% {
          transform: scale(1.2) translateY(-40px);
          opacity: 0.8;
        }
      }

      /* thư */
      .envelope {
        font-size: 80px;
        cursor: pointer;
        animation: pulse 2s infinite;
      }

      @keyframes pulse {
        0% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.1);
        }
        100% {
          transform: scale(1);
        }
      }

      /* chữ chạy */
      .typing {
        width: 70%;
        margin: auto;
        font-size: 26px;
        min-height: 120px;
      }

      /* ảnh */
      .photo {
        width: 320px;
        border-radius: 20px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      }

      /* tim rơi */
      .heart {
        position: absolute;
        font-size: 20px;
        animation: fall linear infinite;
      }

      @keyframes fall {
        from {
          transform: translateY(-10vh);
          opacity: 1;
        }
        to {
          transform: translateY(110vh);
          opacity: 0;
        }
      }

      /* tim bay từ thư */
      .love {
        position: absolute;
        font-size: 22px;
        animation: flyHeart 2s linear forwards;
      }

      @keyframes flyHeart {
        0% {
          transform: translateY(0) scale(0.5);
          opacity: 1;
        }
        100% {
          transform: translateY(-200px) scale(1.3);
          opacity: 0;
        }
      }

      /* pháo hoa */
      .firework {
        position: absolute;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        animation: explode 1.2s ease-out forwards;
      }

      @keyframes explode {
        0% {
          transform: translate(0, 0);
          opacity: 1;
        }
        100% {
          transform: translate(var(--x), var(--y));
          opacity: 0;
        }
      }

      /* tim bay lên từ dưới */
      .heart-up {
        position: absolute;
        font-size: 24px;
        animation: floatUp 3s linear forwards;
        pointer-events: none;
        z-index: 1000;
        bottom: 0;
      }

      @keyframes floatUp {
        0% {
          transform: translateY(0) scale(0.5);
          opacity: 1;
        }
        100% {
          transform: translateY(-120vh) scale(1.2);
          opacity: 0;
        }
      }

      /* nút */
      button {
        padding: 15px 30px;
        font-size: 18px;
        border: none;
        border-radius: 30px;
        cursor: pointer;
        margin-top: 20px;
        background: white;
        color: #ff4b6e;
      }

      /* Nút "Không đồng ý" - fixed toàn màn hình */
      .no {
        position: fixed;
        background: #ff4b6e;
        color: white;
        z-index: 1000;
        display: none; /* Ẩn mặc định, chỉ hiện khi trang 5 active */
      }
    </style>
  </head>

  <body>
    <div class="flower-field" id="flowerField"></div>

    <!-- PAGE 1 - Chúc mừng sinh nhật Dora -->
    <div class="page active" id="page1">
      <h1 style="font-size: 48px; margin-bottom: 10px">
        🥳 Happy Women's Day, Ly! 🥳
      </h1>
      <p style="font-size: 28px; font-style: italic; margin: 20px 0">
        "Chúc mọi điều tốt đẹp sẽ đến với cậu"
      </p>
      <h2 style="font-size: 36px; margin-top: 30px">💖 Ly 💖</h2>
      <button onclick="showFlowers()">Tiếp tục</button>
    </div>

    <!-- PAGE 2 -->
    <div class="page" id="page2">
      <div
        class="envelope"
        onclick="
          heartFromLetter();
          nextPage(3);
        "
      >
        💌
      </div>
      <p>Bấm vào bức thư</p>
    </div>

    <!-- PAGE 3 -->
    <div class="page" id="page3">
      <div class="typing" id="letter"></div>
      <button id="nextBtn" style="display: none" onclick="nextPage(4)">
        Tiếp theo
      </button>
    </div>

    <!-- PAGE 4 -->
    <div class="page" id="page4">
      <img src="crush.jpg" class="photo" />
      <p>Người tớ luôn nghĩ tới😍</p>
      <button onclick="nextPage(5)">Tiếp tục</button>
    </div>

    <!-- PAGE 5 -->
    <div class="page" id="page5">
      <h2>Cậu cho tớ chờ đợi cậu đến lúc cậu sẵn sàng được không? 💖</h2>
      <button onclick="dongy()">Đồng ý</button>
      <!-- Nút "Không đồng ý" đã được chuyển ra ngoài, nằm dưới đây -->
    </div>

    <!-- PAGE 6 -->
    <div class="page" id="page6">
      <h1>Cảm ơn cậu đã cho tớ cơ hội! 💘</h1>
    </div>

    <!-- Nút "Không đồng ý" đặt riêng, fixed toàn màn hình -->
    <button class="no" id="noBtn">Không đồng ý</button>

    <script>
      // Ẩn nút "Không đồng ý" ban đầu
      document.getElementById("noBtn").style.display = "none";

      // Biến đếm số lần hover
      let hoverCount = 0;

      /* chuyển trang */
      function nextPage(n) {
        document
          .querySelectorAll(".page")
          .forEach((p) => p.classList.remove("active"));
        document.getElementById("page" + n).classList.add("active");

        // Điều khiển hiển thị nút "Không đồng ý"
        if (n === 5) {
          document.getElementById("noBtn").style.display = "block";
          // Reset đếm và chữ khi vào lại trang 5
          hoverCount = 0;
          document.getElementById("noBtn").innerText = "Không đồng ý";
        } else {
          document.getElementById("noBtn").style.display = "none";
        }
      }

      /* tạo hoa */
      function showFlowers() {
        let field = document.getElementById("flowerField");
        for (let i = 0; i < 25; i++) {
          let f = document.createElement("div");
          f.className = "flower";
          f.innerHTML = "🌸";
          f.style.left = Math.random() * 100 + "%";
          f.style.top = Math.random() * 100 + "%";
          field.appendChild(f);
        }
        nextPage(2);
      }

      /* tim bay từ thư */
      function heartFromLetter() {
        let letter = document.querySelector(".envelope");
        let rect = letter.getBoundingClientRect();
        for (let i = 0; i < 10; i++) {
          let h = document.createElement("div");
          h.className = "love";
          h.innerHTML = "💖";
          h.style.left = rect.left + 30 + Math.random() * 40 + "px";
          h.style.top = rect.top + 20 + "px";
          document.body.appendChild(h);
          setTimeout(() => h.remove(), 2000);
        }
      }

      /* chữ chạy */
      let message =
        "Nhân ngày 8/3 Tớ chúc cậu luôn hạnh phúc, vui vẻ, xinh tươi như đóa hoa nở rực rỡ giữa thế giới này! Tớ đã suy nghĩ rất lâu trước khi viết những dòng này. Cậu là một người rất đặc biệt với tớ. Chỉ cần được ở gần cậu, ngày của tớ đã trở nên vui hơn rất nhiều.🥰";
      let i = 0;
      function typing() {
        if (i < message.length) {
          document.getElementById("letter").innerHTML += message.charAt(i);
          i++;
          setTimeout(typing, 50);
        } else {
          document.getElementById("nextBtn").style.display = "inline-block";
        }
      }
      typing();

      /* nút chạy + thay đổi chữ theo số lần hover */
      let noBtn = document.getElementById("noBtn");
      noBtn.addEventListener("mouseover", function () {
        // Tăng đếm và đổi chữ (chỉ tăng đến 7)
        if (hoverCount < 7) {
          hoverCount++;
          if (hoverCount === 3) {
            noBtn.innerText = "Không đồng ý.(Thôi đồng ý đi mà 🥺)";
          } else if (hoverCount === 5) {
            noBtn.innerText = "Không đồng ý. (Bấm Đồng ý đi 😭)";
          }
        }

        // Di chuyển nút đến vị trí ngẫu nhiên
        let btnWidth = noBtn.offsetWidth;
        let btnHeight = noBtn.offsetHeight;
        let maxX = window.innerWidth - btnWidth;
        let maxY = window.innerHeight - btnHeight;
        let x = Math.random() * maxX;
        let y = Math.random() * maxY;
        noBtn.style.left = x + "px";
        noBtn.style.top = y + "px";
      });

      /* pháo hoa */
      function firework(x, y) {
        let colors = ["#ff4b6e", "#ffd700", "#00ffff", "#ff00ff", "#ffffff"];
        for (let i = 0; i < 60; i++) {
          let p = document.createElement("div");
          p.classList.add("firework");
          p.style.background =
            colors[Math.floor(Math.random() * colors.length)];
          p.style.left = x + "px";
          p.style.top = y + "px";
          let angle = Math.random() * 2 * Math.PI;
          let radius = 150 + Math.random() * 120;
          p.style.setProperty("--x", Math.cos(angle) * radius + "px");
          p.style.setProperty("--y", Math.sin(angle) * radius + "px");
          document.body.appendChild(p);
          setTimeout(() => p.remove(), 1200);
        }
      }

      /* hàm tạo tim bay lên */
      function createHeartsUp(count) {
        for (let i = 0; i < count; i++) {
          let heart = document.createElement("div");
          heart.className = "heart-up";
          heart.innerHTML = "💖";
          heart.style.left = Math.random() * 100 + "%";
          heart.style.animationDelay = Math.random() * 0.5 + "s";
          heart.style.fontSize = 20 + Math.random() * 20 + "px";
          document.body.appendChild(heart);
          setTimeout(() => heart.remove(), 3000);
        }
      }

      /* hành động khi bấm Đồng ý */
      function dongy() {
        // 100 trái tim bay lên
        createHeartsUp(100);

        // Pháo hoa nổ 10 đợt (mỗi đợt cách nhau 300ms)
        for (let i = 0; i < 10; i++) {
          setTimeout(() => {
            let x = Math.random() * window.innerWidth;
            let y = Math.random() * window.innerHeight;
            firework(x, y);
          }, i * 300);
        }

        // Sau 2 giây chuyển sang trang 6
        setTimeout(() => {
          nextPage(6);
        }, 2000);
      }

      /* tim rơi nền */
      function createHeart() {
        let h = document.createElement("div");
        h.classList.add("heart");
        h.innerHTML = "💖";
        h.style.left = Math.random() * 100 + "vw";
        h.style.animationDuration = Math.random() * 3 + 2 + "s";
        document.body.appendChild(h);
        setTimeout(() => h.remove(), 5000);
      }
      setInterval(createHeart, 300);
    </script>
  </body>
</html>
